<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>12전비 휴가 관리 캘린더</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div id="loginScreen">

    <main class="login-container">

        <div class="login-card">

            <h1>12전비 휴가 관리 캘린더</h1>

            <p class="login-description">
                접속 코드 입력
            </p>

            <div
                id="loginError"
                class="error-message hidden"
            ></div>

            <form id="loginForm">

                <input
                    type="password"
                    id="accessCode"
                    name="code"
                    placeholder="접속 코드"
                    autocomplete="off"
                    required
                >

                <button type="submit">
                    입장
                </button>

            </form>

        </div>

    </main>

</div>


<div
    id="appScreen"
    class="hidden"
>

    <header class="app-header">

        <div class="app-header-titles">
            <h1>12전비 인원 휴가 관리</h1>

            <p>
                12전비 인원 휴가 일정
            </p>
        </div>

        <div class="app-header-status">

            <div
                id="liveClock"
                class="live-clock"
            ></div>

            <div class="session-status">

                <span
                    id="sessionInfo"
                    class="session-info hidden"
                ></span>

                <button
                    id="extendSessionButton"
                    class="extend-button hidden"
                >
                    접속 연장 (+48시간)
                </button>

            </div>

        </div>

        <div class="app-header-actions">

            <button
                id="addVacationButton"
                class="primary-button"
            >
                + 휴가자 일정 추가
            </button>

        </div>

    </header>


    <main class="page-container">

        <section class="calendar-section">

            <div class="calendar-controls">

                <div class="calendar-nav">

                    <div class="button-group calendar-arrow-group">

                        <button
                            id="prevButton"
                            type="button"
                            aria-label="이전 달"
                        >
                            ‹
                        </button>

                        <button
                            id="nextButton"
                            type="button"
                            aria-label="다음 달"
                        >
                            ›
                        </button>

                    </div>

                    <button
                        id="todayButton"
                        type="button"
                        class="calendar-today-button"
                    >
                        오늘
                    </button>

                    <h2
                        id="calendarTitle"
                        class="calendar-title"
                    ></h2>

                </div>

                <div class="button-group calendar-view-toggle">

                    <button
                        id="calendarViewButton"
                        type="button"
                        class="view-toggle-button"
                    >
                        달력
                    </button>

                    <button
                        id="listViewButton"
                        type="button"
                        class="view-toggle-button"
                    >
                        목록
                    </button>

                </div>

            </div>


            <div
                id="calendarGrid"
                class="calendar-grid"
            >

                <div class="calendar-weekdays">
                    <div>월</div>
                    <div>화</div>
                    <div>수</div>
                    <div>목</div>
                    <div>금</div>
                    <div class="calendar-weekday-sat">토</div>
                    <div class="calendar-weekday-sun">일</div>
                </div>

                <div
                    id="calendarDays"
                    class="calendar-days"
                ></div>

            </div>


            <div
                id="listView"
                class="list-view hidden"
            ></div>

        </section>


        <section
            id="indefiniteSection"
            class="indefinite-section hidden"
        >

            <div class="indefinite-header">
                <h2>무기한 휴가자 목록</h2>
            </div>

            <ul
                id="indefiniteList"
                class="indefinite-list"
            ></ul>

        </section>

    </main>


    <footer class="site-footer">

        <span class="footer-note">
            12전비 휴가 관리 캘린더
        </span>

        <div class="footer-actions">

            <button
                id="clearCacheButton"
                class="footer-button"
                type="button"
            >
                캐시 삭제
            </button>

            <button
                id="logoutButton"
                type="button"
                class="footer-button footer-button-danger"
            >
                나가기
            </button>

        </div>

    </footer>

    <div
        id="vacationModal"
        class="modal hidden"
    >

        <div class="modal-background"></div>

        <div class="modal-card">

            <div class="modal-header">

                <h2 id="modalTitle">
                    휴가 일정 추가
                </h2>

                <button
                    id="closeModalButton"
                    class="close-button"
                >
                    ×
                </button>

            </div>


            <form id="vacationForm">

                <input
                    type="hidden"
                    id="vacationId"
                >


                <div class="form-row">

                    <label>
                        <span class="field-label-row">
                            <span>휴가 대상자</span>
                            <span
                                id="personCharCount"
                                class="char-counter"
                            >0/30</span>
                        </span>

                        <input
                            type="text"
                            id="person"
                            placeholder="예: pwkgse"
                            maxlength="30"
                            required
                        >
                    </label>


                    <label>
                        <span class="field-label-row">
                            <span>휴가 사유</span>
                            <span
                                id="reasonCharCount"
                                class="char-counter"
                            >0/50</span>
                        </span>

                        <input
                            type="text"
                            id="reason"
                            placeholder="예: 개인 일정 (정기)"
                            maxlength="50"
                            required
                        >
                    </label>

                </div>



                <label>
                    색상

                    <div
                        class="color-picker"
                        id="colorPicker"
                    >

                        <div
                            id="colorSwatches"
                            class="color-swatches"
                        ></div>

                        <div class="color-custom-row">

                            <span
                                id="colorPreview"
                                class="color-preview is-auto"
                            ></span>

                            <input
                                type="text"
                                id="colorHex"
                                placeholder="#RRGGBB (비워두면 자동 배정)"
                                maxlength="7"
                                autocomplete="off"
                            >

                        </div>

                    </div>
                </label>


                <div class="period-header">

                    <span class="period-header-label">
                        휴가 기간
                    </span>

                    <label class="indefinite-checkbox-label">
                        <span>무기한 휴가</span>
                        <input
                            type="checkbox"
                            id="indefinite"
                        >
                    </label>

                </div>


                <label id="vacationTypeGroup">
                    휴가 종류

                    <div class="button-group">

                        <button
                            type="button"
                            id="regularTypeButton"
                            class="vacation-type-button"
                            data-type="regular"
                        >
                            정기 휴가
                        </button>

                        <button
                            type="button"
                            id="irregularTypeButton"
                            class="vacation-type-button"
                            data-type="irregular"
                        >
                            비정기 휴가
                        </button>

                    </div>
                </label>


                <div class="date-row">

                    <label>
                        시작일

                        <input
                            type="date"
                            id="startDate"
                            class="date-picker-input"
                        >
                    </label>


                    <label>
                        종료일

                        <input
                            type="date"
                            id="endDate"
                            class="date-picker-input"
                        >
                    </label>

                </div>


                <label>
                    <span class="field-label-row">
                        <span>비고</span>
                        <span
                            id="noteCharCount"
                            class="char-counter"
                        >0/500</span>
                    </span>

                    <textarea
                        id="note"
                        placeholder="추가로 남길 내용 작성"
                        maxlength="500"
                    ></textarea>
                </label>


                <div
                    id="formError"
                    class="error-message hidden"
                ></div>


                <div class="modal-buttons">

                    <button
                        type="button"
                        id="deleteButton"
                        class="delete-button hidden"
                    >
                        삭제
                    </button>

                    <div class="modal-buttons-right button-group">

                        <button
                            type="button"
                            id="cancelButton"
                            class="cancel-button"
                        >
                            취소
                        </button>

                        <button
                            type="submit"
                            class="primary-button"
                        >
                            저장
                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

    <div
        id="detailModal"
        class="modal hidden"
    >

        <div class="modal-background"></div>

        <div class="modal-card">

            <div class="modal-header">

                <h2>휴가 정보</h2>

                <button
                    id="closeDetailButton"
                    class="close-button"
                >
                    ×
                </button>

            </div>

            <div class="detail-content">

                <div class="detail-item">
                    <span>대상자</span>
                    <strong id="detailPerson"></strong>
                </div>

                <div class="detail-item">
                    <span>사유</span>
                    <strong id="detailReason"></strong>
                </div>

                <div class="detail-item">
                    <span>기간</span>
                    <strong id="detailDate"></strong>
                </div>

                <div class="detail-item">
                    <span>비고</span>
                    <p id="detailNote"></p>
                </div>

            </div>

            <div class="modal-buttons">

                <button
                    id="editButton"
                    class="primary-button"
                >
                    수정
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</div>

</body>
</html>
